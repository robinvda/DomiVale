name: domivale
description: A small, turn-based kingdom game where the way you grow your city is the way you draw your border
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Game engine
  flame: ^1.37.0
  # Terrain generation and rendering, theme and palette, and small utilities,
  # shared by the Vale games. Private repository: CI loads a deploy key before
  # `pub get`. To take a new engine commit: `flutter pub upgrade vale_engine`.
  # While developing both, this may be `path: ../vale_engine`, but never in
  # a commit: push vale_engine, restore the git source, upgrade, then commit.
  vale_engine:
    git:
      url: git@github.com:robinvda/ValeEngine.git
      ref: main

  # The rules of the game: board, match state, actions, cards, bots. Pure
  # Dart, so the same code runs in the game, in tests and later on a server.
  domivale_rules:
    path: packages/domivale_rules

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Variable.ttf
